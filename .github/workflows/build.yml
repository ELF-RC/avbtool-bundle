name: Build avbtool-mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - edge

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            builder: nuitka
          - arch: arm64
            runner: ubuntu-22.04-arm
            builder: nuitka

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache patchelf zip perl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(python -c 'text=open("avbtool.py", encoding="utf-8").read().splitlines(); names=("MAJOR", "MINOR", "SUB"); print(".".join(next(line.split("=", 1)[1].strip() for line in text if line.startswith("AVB_VERSION_%s = " % name)) for name in names))')"
          DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          NAME="avbtool-mod-${VERSION}-${{ matrix.arch }}-${{ matrix.builder }}-${DATE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 1) OpenSSL CLI + shared libcrypto (used by the fec tool)
      # ------------------------------------------------------------------
      - name: Build OpenSSL
        run: |
          set -o pipefail
          mkdir -p build_logs
          cd openssl
          # Sanity: fail early with a clear message if the checkout is
          # incomplete (it has been observed that some runners materialise
          # a partial vendored openssl/ tree, which makes Configure exit
          # non-zero without any useful output of its own).
          for f in Configure config config.com build.info configdata.pm.in; do
            [ -f "$f" ] || { echo "FATAL: missing vendored source file openssl/$f — checkout incomplete"; exit 2; }
          done
          [ -d crypto ] && [ -d apps ] && [ -d include/openssl ] || { echo "FATAL: missing vendored source dir — checkout incomplete"; exit 2; }
          ls include/openssl/*.h.in > /dev/null 2>&1 || { echo "FATAL: missing include/openssl/*.h.in templates — checkout incomplete"; exit 2; }
          echo "=== vendored openssl tree OK (version):"; grep -E '^MAJOR|^MINOR|^PATCH' VERSION.dat 2>/dev/null || head -3 CHANGES.md
          # no-asm: skip Perl-generated assembly (faster, fewer toolchain deps)
          # no-shared: static libs — no runtime library path juggling in the package
          # -no-docs: skip man/html doc generation (needs Pod::Man/Pod::Html,
          # not present on the x86_64 ubuntu-22.04 runner base image)
          ./Configure no-asm no-shared -no-docs --prefix="$PWD/install" \
            > ../build_logs/openssl-configure.log 2>&1 || {
              echo "=== Configure FAILED, log tail:";
              tail -30 ../build_logs/openssl-configure.log;
              exit 1; }
          make -j"$(nproc)" \
            > ../build_logs/openssl-make.log 2>&1 || {
              echo "=== make FAILED, log tail:";
              tail -30 ../build_logs/openssl-make.log;
              exit 1; }
          make install \
            > ../build_logs/openssl-install.log 2>&1 || {
              echo "=== make install FAILED, log tail:";
              tail -30 ../build_logs/openssl-install.log;
              exit 1; }
          # x86_64 runners put static libs in install/lib64; normalise so
          # downstream steps (and the packaged fec binary) see a single
          # well-known layout: install/lib.
          if [ -d "$PWD/install/lib64" ] && [ ! -d "$PWD/install/lib" ]; then
            mv "$PWD/install/lib64" "$PWD/install/lib"
          fi
          ls -l install/bin/openssl install/lib/libcrypto.a install/lib/libssl.a
          # Smoke test the packaged CLI (static build, no library path needed)
          ./install/bin/openssl version

      - name: Build fec CLI
        run: |
          mkdir -p bin
          # RS-8 char codec (extern/fec) + standalone main.
          # fec.c provides the partab/P_init tables the codec needs.
          # Links against the statically-built libcrypto (no runtime deps).
          # -static-libgcc so the binary has no libgcc_s.so dependency.
          # -fopenmp: the column loop in fec_cli.c is embarrassingly
          # parallel and compiled with OpenMP; output is deterministic
          # regardless of thread count (columns are independent).
          gcc -O2 -fopenmp -static-libgcc -o bin/fec \
            fec_core/fec_cli.c \
            fec/encode_rs_char.c fec/init_rs_char.c fec/fec.c \
            -Ifec -Iopenssl/install/include \
            -Lopenssl/install/lib -Wl,-Bstatic -lcrypto -Wl,-Bdynamic
          ./bin/fec --print-fec-size 4096 --roots 2
          echo "fec CLI OK"

      - name: Build avbtool (Nuitka)
        run: |
          set -o pipefail
          python -m nuitka \
            --standalone \
            --onefile \
            --output-filename=avbtool \
            --output-dir=.avbtool-dist \
            --assume-yes-for-downloads \
            --verbose \
            --verbose-output=build_logs/nuitka-build.log \
            --onefile-no-compression \
            --static-libpython=yes \
            avbtool.py > build_logs/nuitka-stdout.log 2>&1
          ls -l .avbtool-dist/avbtool

      - name: Assemble package
        run: |
          rm -rf pkg && mkdir -p pkg/bin
          install -m 755 .avbtool-dist/avbtool pkg/bin/avbtool
          install -m 755 bin/fec pkg/bin/fec
          install -m 755 openssl/install/bin/openssl pkg/bin/openssl
          # All three binaries are static/self-contained (no runtime .so needed).
          # Sanity-check: fec/openssl must run with NO library paths set.
          env -i ./pkg/bin/fec --print-fec-size 4096 --roots 2
          env -i ./pkg/bin/openssl version
          # avbtool is a frozen onefile; just confirm it is an executable ELF
          # (we cannot run it here if arch != runner arch).
          file pkg/bin/avbtool || true
          (cd pkg && tar -czf "../${{ steps.meta.outputs.name }}.tar.gz" bin)
          tar -tzvf "${{ steps.meta.outputs.name }}.tar.gz"
          echo "=== package contents ==="
          ls -lh pkg/bin/

      - name: Package build logs
        if: always()
        run: |
          mkdir -p logs
          {
            echo "=== Workflow Environment ==="
            echo "Date: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Runner: ${{ matrix.runner }}"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Builder: ${{ matrix.builder }}"
            echo ""
            echo "=== System Info ==="
            uname -a
            echo ""
            echo "=== Python Version ==="
            python --version
            echo "=== Nuitka Version ==="
            python -m nuitka --version 2>&1 || true
          } > logs/workflow-env.log
          find build_logs -type f -exec cp --parents {} logs/ \; 2>/dev/null || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-logs
          path: logs/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
